name: CI

# The pipeline is the gate (Section 2.5). A commit that cannot pass every job
# here does not reach staging, and nobody deploys by hand.
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://medilink:medilink@localhost:5432/medilink?schema=public
  APP_URL: http://localhost:3000
  SESSION_SECRET: ci-session-secret-value-at-least-32-chars
  STORAGE_ENDPOINT: http://localhost:9000
  STORAGE_BUCKET: medilink-documents
  STORAGE_ACCESS_KEY_ID: medilink
  STORAGE_SECRET_ACCESS_KEY: medilink-secret

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  migrations:
    name: Migrations and seed on an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medilink
          POSTGRES_PASSWORD: medilink
          POSTGRES_DB: medilink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medilink" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stage 4.1: up, down, up again. A migration that cannot roll back is
      # planned across two releases, not merged as one.
      - name: migrate up
        run: pnpm prisma migrate deploy
      - name: migrate down and up again
        run: pnpm prisma migrate reset --force --skip-seed && pnpm prisma migrate deploy
      # Stage 3.7: seed data loads into an empty database by migration alone.
      - name: seed and assert row counts
        run: pnpm db:seed

  integration:
    name: Integration against a real database
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medilink
          POSTGRES_PASSWORD: medilink
          POSTGRES_DB: medilink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medilink" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      # Stage 4.5 (no write without an audit row) and 4.6 (no event lost on
      # consumer failure). Neither is observable without a real PostgreSQL:
      # one depends on transaction boundaries, the other on SKIP LOCKED.
      # The suite creates and migrates medilink_test itself.
      - name: audit coverage and outbox recovery
        run: pnpm test:integration

  image:
    name: Production image builds and carries what it runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing built the image before, which is how it shipped without the
      # worker's source: `pnpm worker` could not start from it.
      - name: build the runner image
        run: docker build --target runner -t medilink:ci .
      - name: the web process, the worker and the migrations are all in it
        run: |
          for f in src/worker/index.ts src/lib/db.ts next.config.mjs tsconfig.json \
                   prisma/schema.prisma scripts/docker-entrypoint.sh \
                   node_modules/.bin/next node_modules/.bin/tsx node_modules/.bin/prisma; do
            docker run --rm --entrypoint test medilink:ci -e "$f" || { echo "missing from the image: $f"; exit 1; }
          done
          docker run --rm --entrypoint test medilink:ci -d prisma/migrations
      - name: it runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id medilink:ci -u)" != "0"

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisories accepted on purpose are listed in package.json under pnpm.auditConfig.ignoreGhsas,
      # and nothing else is: a new one still fails this step.
      #   GHSA-mrhx-c7xc-m3w5, zod 3.25.76 (high): memory exhaustion validating oversized
      #   constrained collections. The only fix is zod 4.6.6, a major upgrade that means migrating
      #   every validation schema. Accepted on 24 October 2026 and to be revisited by 24 November
      #   2026: migrate to zod 4, or renew this with a reason.
      - name: dependency audit
        run: pnpm audit --audit-level high
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      # The journeys sign up through the real form, so they read one-time
      # codes off the console SMS adapter — which only runs in local.
      APP_ENV: local
      SMS_CONSOLE_OUTBOX: .e2e/sms-outbox.jsonl
      # The money journey pays a nurse through the stub gateway, as a laptop's .env does
      # (the default is `none`, which refuses every payout). It is about the invoice and
      # the payout, not about two finance officers or a verified bank account, so those two
      # controls are off for it and covered by their own integration tests.
      PAYMENT_PROVIDER: console
      PAYOUT_SECOND_APPROVER: 'off'
      PAYOUT_REQUIRES_ACCOUNT: 'off'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medilink
          POSTGRES_PASSWORD: medilink
          POSTGRES_DB: medilink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medilink" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `migrate deploy` does not generate the client, and the seed imports it. The
      # migrations job gets one for free from `migrate reset`; this job has no reset.
      - run: pnpm prisma generate
      # MinIO stands in for Tigris, as it does in docker-compose. MinIO no longer
      # publishes its images (minio/minio on Docker Hub and quay.io/minio/minio both
      # refuse a pull), so this is Bitnami's frozen archive of the last community
      # build: the same server, started with its own entrypoint rather than
      # `server /data`, which is why the arguments differ from MinIO's own image.
      - name: object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=medilink -e MINIO_ROOT_PASSWORD=medilink-secret \
            bitnamilegacy/minio:2025.7.23-debian-12-r5
          # The health endpoint can answer before the server takes requests, and the Bitnami
          # entrypoint can restart it once it is configured, so one attempt at the bucket step
          # failed this job twice with "connection reset by peer". Try it until MinIO accepts it.
          for i in $(seq 1 30); do
            if docker run --rm --network host --entrypoint sh bitnamilegacy/minio-client:2025.7.21-debian-12-r3 -c \
              "mc alias set local http://localhost:9000 medilink medilink-secret && mc mb --ignore-existing local/medilink-documents"; then
              exit 0
            fi
            sleep 2
          done
          docker logs minio
          exit 1
      - run: pnpm prisma migrate deploy && pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # Global setup waits for the app, warms it and builds the journeys'
      # world with `pnpm tsx scripts/e2e-world.ts`. The worker has to run
      # too: sign-up's grant and every timesheet arrive through the outbox.
      - name: start and test
        run: |
          pnpm start > app.log 2>&1 &
          pnpm worker > worker.log 2>&1 &
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            app.log
            worker.log
