<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker><marker id="arrr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker></defs><rect width="1100" height="700" fill="#ffffff"/><rect x="30" y="14" width="240" height="46" rx="10" fill="#fff1e6" stroke="#c2410c" stroke-width="2"/><text x="150.0" y="43.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#7c2d12" text-anchor="middle">Facility</text><line x1="150.0" y1="62" x2="150.0" y2="560" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="300" y="14" width="270" height="46" rx="10" fill="#f1ecfb" stroke="#6d28d9" stroke-width="2"/><text x="435.0" y="43.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">Licensed payment provider</text><line x1="435.0" y1="62" x2="435.0" y2="560" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="600" y="14" width="230" height="46" rx="10" fill="#e6f0ff" stroke="#1d4ed8" stroke-width="2"/><text x="715.0" y="43.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Professional</text><line x1="715.0" y1="62" x2="715.0" y2="560" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="850" y="14" width="220" height="46" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="960.0" y="43.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle">Medilink</text><line x1="960.0" y1="62" x2="960.0" y2="560" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 5"/><text x="435.0" y="82" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6d28d9" text-anchor="middle">holds the money — Medilink never does</text><line x1="150.0" y1="130" x2="435.0" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="184.0" y="107.5" width="217.00000000000003" height="18.5" fill="#ffffff"/><text x="292.5" y="120" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">1  Accepts the quote and pays</text><rect x="141.44" y="141.5" width="302.12" height="16.5" fill="#ffffff"/><text x="292.5" y="152" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">₦40,000 agreed pay + ₦2,000 service fee = ₦42,000</text><rect x="285.0" y="178" width="300" height="54" rx="10" fill="#f1ecfb" stroke="#6d28d9" stroke-width="2"/><text x="435.0" y="203.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="middle">2  Authorises and safeguards ₦42,000</text><text x="435.0" y="218.5" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">booking becomes CONFIRMED and funded</text><line x1="150.0" y1="290" x2="435.0" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="156.0" y="267.5" width="273.0" height="18.5" fill="#ffffff"/><text x="292.5" y="280" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">3  Shift attended; timesheet approved</text><rect x="156.14" y="301.5" width="272.72" height="16.5" fill="#ffffff"/><text x="292.5" y="312" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(auto-approved after N days unless disputed)</text><line x1="435.0" y1="366" x2="715.0" y2="366" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="501.5" y="343.5" width="147.0" height="18.5" fill="#ffffff"/><text x="575.0" y="356" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">4  Releases ₦40,000</text><rect x="441.58" y="377.5" width="266.84000000000003" height="16.5" fill="#ffffff"/><text x="575.0" y="388" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">to the professional's verified bank account</text><line x1="435.0" y1="440" x2="960.0" y2="440" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="596.0" y="417.5" width="203.00000000000003" height="18.5" fill="#ffffff"/><text x="697.5" y="430" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">4b  Releases the ₦2,000 fee</text><rect x="552.3199999999999" y="451.5" width="290.36" height="16.5" fill="#ffffff"/><text x="697.5" y="462" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">to Medilink (provider charge: decision pending)</text><rect x="760" y="478" width="330" height="54" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="925.0" y="503.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#134e4a" text-anchor="middle">5  Ledger records every entry</text><text x="925.0" y="518.5" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">gross · fee · tax · provider charge · facility debit · payout</text><rect x="30" y="574" width="1040" height="112" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="613.25" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Side paths</text><text x="550.0" y="629.25" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Dispute: only the disputed amount is held; the undisputed part settles on schedule. After settlement a reversal entry corrects it.</text><text x="550.0" y="643.75" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Cancellation: the provider voids or captures part, according to the cancellation rules snapshotted at acceptance.</text><text x="550.0" y="658.25" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Provider timeout or repeated webhook: a pending state and idempotent handling — never recorded as a failure while money may have moved.</text></svg>