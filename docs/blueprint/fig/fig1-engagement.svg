<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker><marker id="arrr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker></defs><rect width="1100" height="520" fill="#ffffff"/><rect x="10" y="14" width="690" height="96" rx="12" fill="#fff1e6" opacity="0.55"/><text x="24" y="36" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7c2d12" text-anchor="start">Facility-led (origin: FACILITY_POSTED or PRACTITIONER_APPLIED)</text><rect x="10" y="122" width="690" height="96" rx="12" fill="#e6f0ff" opacity="0.55"/><text x="24" y="144" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Professional-led (origin: LISTING_BOOKED)</text><rect x="26" y="44" width="188" height="56" rx="10" fill="#fff1e6" stroke="#c2410c" stroke-width="2"/><text x="120.0" y="70.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Facility publishes</text><text x="120.0" y="86.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">a shift at a required level</text><rect x="262" y="44" width="188" height="56" rx="10" fill="#fff1e6" stroke="#c2410c" stroke-width="2"/><text x="356.0" y="70.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Eligible professionals</text><text x="356.0" y="86.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">are matched (hard rules)</text><rect x="498" y="44" width="188" height="56" rx="10" fill="#fff1e6" stroke="#c2410c" stroke-width="2"/><text x="592.0" y="70.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Professional accepts</text><text x="592.0" y="86.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">or counters (≤ 2 rounds)</text><rect x="26" y="152" width="188" height="56" rx="10" fill="#e6f0ff" stroke="#1d4ed8" stroke-width="2"/><text x="120.0" y="178.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Professional publishes</text><text x="120.0" y="194.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">availability and rate (opt-in)</text><rect x="262" y="152" width="188" height="56" rx="10" fill="#e6f0ff" stroke="#1d4ed8" stroke-width="2"/><text x="356.0" y="178.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Facility searches</text><text x="356.0" y="194.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">verified available people</text><rect x="498" y="152" width="188" height="56" rx="10" fill="#e6f0ff" stroke="#1d4ed8" stroke-width="2"/><text x="592.0" y="178.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Facility sends</text><text x="592.0" y="194.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">a booking offer</text><line x1="214" y1="72" x2="262" y2="72" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><line x1="214" y1="180" x2="262" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><line x1="450" y1="72" x2="498" y2="72" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><line x1="450" y1="180" x2="498" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="760" y="52" width="320" height="150" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="920.0" y="97.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#134e4a" text-anchor="middle">ONE BOOKING</text><text x="920.0" y="118.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">origin: FACILITY_POSTED</text><text x="920.0" y="133.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">PRACTITIONER_APPLIED</text><text x="920.0" y="148.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">LISTING_BOOKED</text><text x="920.0" y="163.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Agreed level, rate and unit, fee policy,</text><text x="920.0" y="178.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">cancellation rules — snapshotted at acceptance</text><line x1="686" y1="72" x2="760" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><line x1="686" y1="180" x2="760" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><line x1="920" y1="202" x2="920" y2="262" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="1010" y="240" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f766e" text-anchor="middle">same from here on</text><rect x="12" y="270" width="122" height="64" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="73.0" y="300.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Credential</text><text x="73.0" y="316.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">revalidation</text><line x1="134" y1="302" x2="145" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="145" y="270" width="122" height="64" rx="10" fill="#f1ecfb" stroke="#6d28d9" stroke-width="2"/><text x="206.0" y="300.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">Payment</text><text x="206.0" y="316.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">authorisation</text><line x1="267" y1="302" x2="278" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="278" y="270" width="122" height="64" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="339.0" y="300.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Confirmed</text><text x="339.0" y="316.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">booking</text><line x1="400" y1="302" x2="411" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="411" y="270" width="122" height="64" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="472.0" y="307.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Attendance</text><line x1="533" y1="302" x2="544" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="544" y="270" width="122" height="64" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="605.0" y="307.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Timesheet</text><line x1="666" y1="302" x2="677" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="677" y="270" width="122" height="64" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="738.0" y="300.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Approval</text><text x="738.0" y="316.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">or dispute</text><line x1="799" y1="302" x2="810" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="810" y="270" width="122" height="64" rx="10" fill="#f1ecfb" stroke="#6d28d9" stroke-width="2"/><text x="871.0" y="307.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">Settlement</text><line x1="932" y1="302" x2="943" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="943" y="270" width="122" height="64" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="1004.0" y="300.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Two-way</text><text x="1004.0" y="316.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">review</text><rect x="12" y="380" width="330" height="92" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="177.0" y="416.25" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#134e4a" text-anchor="middle">Checked again at confirmation</text><text x="177.0" y="432.75" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">licence, level, competence,</text><text x="177.0" y="447.75" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">consent, facility status, clock</text><rect x="386" y="380" width="330" height="92" rx="10" fill="#f1ecfb" stroke="#6d28d9" stroke-width="2"/><text x="551.0" y="416.25" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4c1d95" text-anchor="middle">A licensed provider holds the money</text><text x="551.0" y="432.75" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Medilink records the ledger,</text><text x="551.0" y="447.75" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">never the balance</text><rect x="760" y="380" width="330" height="92" rx="10" fill="#fff1e6" stroke="#c2410c" stroke-width="2"/><text x="925.0" y="416.25" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#7c2d12" text-anchor="middle">Contact released only after acceptance</text><text x="925.0" y="432.75" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">approximate area before that;</text><text x="925.0" y="447.75" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">no phone, no street address</text><line x1="73" y1="334" x2="180" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><line x1="300" y1="334" x2="540" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><line x1="990" y1="334" x2="930" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="550" y="502" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Colours: orange = facility side · blue = professional side · teal = Medilink system · violet = money handled by the licensed provider</text></svg>