font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">subscriptions; labelled</text><text x="1022.0" y="189.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">sponsors only</text><text x="550" y="30" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Order of work: make it safe → prove the loop in one place → open both sides → make money trustworthy → grow</text><line x1="164.0" y1="220" x2="164.0" y2="232" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="3 4"/><polygon points="164.0,232 175.0,243 164.0,254 153.0,243" fill="#c2410c"/><text x="164.0" y="274" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#7c2d12" text-anchor="middle">Gate: P0 closed;</text><text x="164.0" y="288" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#7c2d12" text-anchor="middle">restore drilled</text><line x1="320.0" y1="220" x2="320.0" y2="232" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="3 4"/><polygon points="320.0,232 331.0,243 320.0,254 309.0,243" fill="#c2410c"/><text x="320.0" y="274" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#7c2d12" text-anchor="middle">Gate: ≥ 50 verified;</text><text x="320.0" y="288" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#7c2d12" text-anchor="middle">fill ≈ 70%</text><line x1="632.0" y1="220" x2="632.0" y2="232" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="3 4"/><polygon points="632.0,232 643.0,243 632.0,254 621.0,243" fill="#c2410c"/><text x="632.0" y="274" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#7c2d12" text-anchor="middle">Gate: reconciliation clean;</text><text x="632.0" y="28