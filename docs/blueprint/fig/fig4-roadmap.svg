<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker><marker id="arrr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker></defs><rect width="1100" height="410" fill="#ffffff"/><rect x="14" y="70" width="144" height="150" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="2"/><text x="86.0" y="121.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">Phase 0</text><text x="86.0" y="137.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">Make it safe</text><text x="86.0" y="153.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">~4 weeks</text><text x="86.0" y="167.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">P0 gaps; SMS; deploy;</text><text x="86.0" y="181.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">backups; public pages</text><line x1="158" y1="145" x2="170" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="170" y="70" width="144" height="150" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="242.0" y="121.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Phase 1</text><text x="242.0" y="137.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Gombe pilot</text><text x="242.0" y="153.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">6–8 weeks</text><text x="242.0" y="167.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">free; levels in the data;</text><text x="242.0" y="181.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">fee row at 0%</text><line x1="314" y1="145" x2="326" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="326" y="70" width="144" height="150" rx="10" fill="#e6f0ff" stroke="#1d4ed8" stroke-width="2"/><text x="398.0" y="121.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Phase 2</text><text x="398.0" y="137.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Two-sided</text><text x="398.0" y="153.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">6–8 weeks</text><text x="398.0" y="167.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">listings; offers;</text><text x="398.0" y="181.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">counters; one Booking</text><line x1="470" y1="145" x2="482" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="482" y="70" width="144" height="150" rx="10" fill="#f1ecfb" stroke="#6d28d9" stroke-width="2"/><text x="554.0" y="113.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">Phase 3</text><text x="554.0" y="129.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">Money you</text><text x="554.0" y="145.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">can trust</text><text x="554.0" y="161.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">6–8 weeks</text><text x="554.0" y="175.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">provider; reconciliation;</text><text x="554.0" y="189.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">then the fee</text><line x1="626" y1="145" x2="638" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="638" y="70" width="144" height="150" rx="10" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="113.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Phase 4</text><text x="710.0" y="129.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Trust and</text><text x="710.0" y="145.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">retention</text><text x="710.0" y="161.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">ongoing</text><text x="710.0" y="175.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">reviews; repeat;</text><text x="710.0" y="189.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">recurring; replacement</text><line x1="782" y1="145" x2="794" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="794"