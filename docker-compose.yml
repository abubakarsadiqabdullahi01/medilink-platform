# Local development stack. One command brings up every dependency the
# application needs, so no developer needs anything installed but Docker.
#   docker compose up -d
#   docker compose exec web pnpm db:migrate
#   docker compose exec web pnpm db:seed
name: medilink

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medilink
      POSTGRES_PASSWORD: medilink
      POSTGRES_DB: medilink
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medilink -d medilink"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO stands in locally for Tigris. Both are S3-compatible, so the
  # application code and the signed-URL flow are identical in both places.
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medilink
      MINIO_ROOT_PASSWORD: medilink-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 medilink medilink-secret &&
      mc mb --ignore-existing local/medilink-documents &&
      mc anonymous set none local/medilink-documents &&
      echo 'bucket ready: medilink-documents (private, signed URLs only)'
      "

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build:
      context: .
      target: development
    command: sh -c "pnpm prisma migrate deploy && pnpm dev"
    environment:
      DATABASE_URL: postgresql://medilink:medilink@db:5432/medilink?schema=public
      STORAGE_ENDPOINT: http://storage:9000
      SMTP_URL: smtp://mail:1025
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  # The outbox worker. Runs separately from the web process so a slow
  # consumer can never block a request.
  worker:
    build:
      context: .
      target: development
    command: pnpm worker
    environment:
      DATABASE_URL: postgresql://medilink:medilink@db:5432/medilink?schema=public
      STORAGE_ENDPOINT: http://storage:9000
      SMTP_URL: smtp://mail:1025
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
