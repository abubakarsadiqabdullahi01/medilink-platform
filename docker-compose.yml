# Local development stack. One command brings up every dependency the
# application needs, so no developer needs anything installed but Docker.
#   docker compose up -d
#   docker compose exec web pnpm db:migrate
#   docker compose exec web pnpm db:seed
name: medilink

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medilink
      POSTGRES_PASSWORD: medilink
      POSTGRES_DB: medilink
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medilink -d medilink"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO stands in locally for Tigris. Both are S3-compatible, so the
  # application code and the signed-URL flow are identical in both places.
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medilink
      MINIO_ROOT_PASSWORD: medilink-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 medilink medilink-secret &&
      mc mb --ignore-existing local/medilink-documents &&
      mc anonymous set none local/medilink-documents &&
      echo 'bucket ready: medilink-documents (private, signed URLs only)'
      "

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build:
      context: .
      target: development
    command: sh -c "pnpm prisma migrate deploy && pnpm dev"
    environment:
      DATABASE_URL: postgresql://medilink:medilink@db:5432/medilink?schema=public
      STORAGE_ENDPOINT: http://storage:9000
      # The address a *browser* can reach, which is not the one this process
      # uses: a laptop cannot resolve `storage` on the compose network. Signed
      # URLs are built against this, or every upload is correctly signed and
      # impossible to open.
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      SMTP_URL: smtp://mail:1025
      # Where the console SMS adapter also writes each message, inside the
      # bind mount so the browser journeys on the host can read the codes.
      SMS_CONSOLE_OUTBOX: .e2e/sms-outbox.jsonl
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  # The app as production runs it, for the browser journeys:
  #   docker compose --profile e2e up -d e2e
  #   APP_URL=http://localhost:3100 E2E_SERVICE=e2e pnpm test:e2e
  # Built once rather than compiled on each first request, into its own
  # .next-e2e, so restarting `web` — or a build run in it — cannot pull the
  # app out from under a run. It borrows `web`'s image and installed
  # node_modules rather than installing its own, so starting it needs no
  # network. Shares the database, storage and worker.
  e2e:
    profiles: [e2e]
    image: medilink-web
    # `next build` rewrites next-env.d.ts and tsconfig.json to point at the
    # build directory it used. Both live in the shared checkout, so they are
    # put back afterwards — exactly as they were, edits included.
    command: >
      sh -c "cp next-env.d.ts tsconfig.json /tmp/ && pnpm build; built=$$?;
      cp /tmp/next-env.d.ts /tmp/tsconfig.json ./;
      [ $$built -eq 0 ] && pnpm start"
    environment:
      NODE_ENV: production
      NEXT_DIST_DIR: .next-e2e
      # E2E_DATABASE_URL points this same build at the production-sized
      # `medilink_perf` database for scripts/page-budget.mjs; unset, it is the dev one.
      DATABASE_URL: ${E2E_DATABASE_URL:-postgresql://medilink:medilink@db:5432/medilink?schema=public}
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      SMTP_URL: smtp://mail:1025
      SMS_CONSOLE_OUTBOX: .e2e/sms-outbox.jsonl
    env_file:
      - .env
    ports:
      - "3100:3000"
    volumes_from:
      - web
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  # The app as production runs it, on the address the demo uses:
  #   scripts/demo.ps1 on     (stops `web`, builds, serves http://localhost:3000)
  #   scripts/demo.ps1 off    (back to the hot-reloading development server)
  # `next dev` compiles each page the first time somebody opens it, and over a
  # Windows bind mount every file read is slow, so the first visit to each
  # screen takes seconds and a presentation spends its time waiting. A
  # production build is compiled once, up front, and then every page is instant.
  # It cannot run beside `web`: both want port 3000.
  demo:
    profiles: [demo]
    image: medilink-web
    command: >
      sh -c "cp next-env.d.ts tsconfig.json /tmp/ && pnpm build; built=$$?;
      cp /tmp/next-env.d.ts /tmp/tsconfig.json ./;
      [ $$built -eq 0 ] && pnpm start"
    environment:
      NODE_ENV: production
      NEXT_DIST_DIR: .next-demo
      DATABASE_URL: postgresql://medilink:medilink@db:5432/medilink?schema=public
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      SMTP_URL: smtp://mail:1025
      SMS_CONSOLE_OUTBOX: .e2e/sms-outbox.jsonl
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes_from:
      - web
    depends_on:
      db:
        condition: service_healthy

  # The outbox worker. Runs separately from the web process so a slow
  # consumer can never block a request.
  worker:
    build:
      context: .
      target: development
    command: pnpm worker
    environment:
      DATABASE_URL: postgresql://medilink:medilink@db:5432/medilink?schema=public
      STORAGE_ENDPOINT: http://storage:9000
      # The address a *browser* can reach, which is not the one this process
      # uses: a laptop cannot resolve `storage` on the compose network. Signed
      # URLs are built against this, or every upload is correctly signed and
      # impossible to open.
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      SMTP_URL: smtp://mail:1025
      # Where the console SMS adapter also writes each message, inside the
      # bind mount so the browser journeys on the host can read the codes.
      SMS_CONSOLE_OUTBOX: .e2e/sms-outbox.jsonl
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
